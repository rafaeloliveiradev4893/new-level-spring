spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER}
auth0.audience=${AUTH0_AUDIENCE}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}

# Spring configuration
spring.config.import=optional:file:.env[.properties]
spring.application.name=new-level-spring
server.port=${PORT:8080}

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true 
spring.jpa.properties.hibernate.format_sql=true