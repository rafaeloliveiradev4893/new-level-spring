# Application
spring.application.name=new-level-spring
server.port=${PORT:8080}

# Auth0
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER}
auth0.audience=${AUTH0_AUDIENCE}

# CORS - URL do frontend em produção
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:https://new-level.vercel.app}

# Datasource
spring.datasource.url=jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration